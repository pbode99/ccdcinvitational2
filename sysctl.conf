# CCDC kernel hardening (MWCCDC Invitational, Debian 12 Splunk box).
# harden.sh installs this as /etc/sysctl.d/99-ccdc-hardening.conf; it does NOT replace /etc/sysctl.conf.
# Undo: sudo rm /etc/sysctl.d/99-ccdc-hardening.conf && sudo sysctl --system
# Intentionally NOT set (can cost points or block incident response):
#   net.ipv4.icmp_echo_ignore_all=1   ping is scored and ICMP must stay on (Play #12)
#   kernel.yama.ptrace_scope=3        locks even root out of strace/gdb until reboot
#   user.max_user_namespaces=0        breaks systemd-sandboxed services, root included

# Filesystem
fs.protected_fifos=2
fs.protected_hardlinks=1
fs.protected_regular=2
fs.protected_symlinks=1
fs.suid_dumpable=0

# Kernel
kernel.ctrl-alt-del=0
kernel.dmesg_restrict=1
kernel.kptr_restrict=2
kernel.randomize_va_space=2
kernel.sysrq=0
kernel.unprivileged_bpf_disabled=1
net.core.bpf_jit_harden=2
# Blocks unprivileged user namespaces (common local privilege escalation path).
kernel.unprivileged_userns_clone=0
# 2 = only root can ptrace; root can still strace a suspicious process.
kernel.yama.ptrace_scope=2
# Reboot on kernel panic instead of hanging (the VM comes back on its own).
kernel.panic=10
vm.unprivileged_userfaultfd=0

# IPv4: this box is a server, not a router (addressing stays unchanged, Systems #6)
net.ipv4.ip_forward=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
# Log spoofed/impossible packets (kernel log -> rsyslog -> Splunk)
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1
# Ping MUST answer (scored; Competition Play #12)
net.ipv4.icmp_echo_ignore_all=0
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_rfc1337=1

# IPv6: the competition network is IPv4 only. If a scored service stops answering,
# set both to 0:  sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0 net.ipv6.conf.default.disable_ipv6=0
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
